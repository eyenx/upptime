name: Response Time CI
on:
  schedule:
    - cron: "0 23 * * *"
  repository_dispatch:
    types: [response_time]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  release:
    name: Check status
    runs-on: ubuntu-latest
    env:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
    steps:
      - name: Create GitHub App token
        id: app_token
        if: ${{ vars.GH_APP_ID != '' && env.GH_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}
      - name: Clear GitHub App private key
        if: ${{ always() }}
        shell: bash
        run: echo "GH_APP_PRIVATE_KEY=" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
      - name: Update response time
        uses: upptime/uptime-monitor@v1.44.0
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
          # Configure the secret allowlist in .upptimerc.yml; do not edit this workflow directly.
          SECRETS_CONTEXT: '{"SITE_NEXTCLOUD":${{ toJson(secrets.SITE_NEXTCLOUD) }},"SITE_GIT":${{ toJson(secrets.SITE_GIT) }},"SITE_CI":${{ toJson(secrets.SITE_CI) }},"SITE_MAIL":${{ toJson(secrets.SITE_MAIL) }},"SITE_CR":${{ toJson(secrets.SITE_CR) }},"SITE_MATRIX":${{ toJson(secrets.SITE_MATRIX) }},"SITE_WB":${{ toJson(secrets.SITE_WB) }},"SITE_IMMICH":${{ toJson(secrets.SITE_IMMICH) }},"SITE_JELLYFIN":${{ toJson(secrets.SITE_JELLYFIN) }},"TCP_MAIL":${{ toJson(secrets.TCP_MAIL) }}}'
