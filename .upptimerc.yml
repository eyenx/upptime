owner: eyenx # Your GitHub username
repo: upptime # Your GitHub repository name

secrets:
  - SITE_NEXTCLOUD
  - SITE_GIT
  - SITE_CI
  - SITE_MAIL
  - SITE_CR
  - SITE_MATRIX
  - SITE_WB
  - SITE_IMMICH
  - SITE_JELLYFIN
  - TCP_MAIL

sites:
  - name: Blog
    url: https://eyenx.ch
  - name: pub.eyenx.ch
    url: https://pub.eyenx.ch
  - name: NextCloud
    url: $SITE_NEXTCLOUD
  - name: Git
    url: $SITE_GIT
  - name: Private CI
    url: $SITE_CI
  - name: Mail
    url: $SITE_MAIL
  - name: Container Registry
    url: $SITE_CR
  - name: Matrix
    url: $SITE_MATRIX
  - name: Wallabag
    url: $SITE_WB
  - name: Immich
    url: $SITE_IMMICH
  - name: Jellyfin
    url: $SITE_JELLYFIN
  - name: upptime
    url: https://status.eyenx.ch
  - name: Mail test
    url: $TCP_MAIL
  - name: Mail 465
    url: $TCP_MAIL
    port: 465
    check: tcp-ping
  - name: Mail 587
    url: $TCP_MAIL
    port: 587
    check: tcp-ping
  - name: Mail 993
    url: $TCP_MAIL
    port: 993
    check: tcp-ping
  - name: Mail 995
    url: $TCP_MAIL
    port: 995
    check: tcp-ping

status-website:
  cname: status.eyenx.ch
  name: service status
  logoUrl: https://avatars.githubusercontent.com/u/1947882?s=460&u=1754c8d2ff687c003d18f279f93217688d805346
  introTitle: "Welcome to my service status page which uses **real-time** data from [GitHub](https://github.com/eyenx/upptime)."
